[package]
name = "deskfolio"
version = "0.3.0"
description = "Offline PDF toolkit: view, organize, sign, compress, convert, OCR"
license = "MIT"
edition = "2021"

[lib]
# `_lib` keeps the lib name distinct from the bin on Windows (cargo#8519).
name = "deskfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
lopdf = "0.45"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Digital IDs: reading and writing .pfx / .p12 files (incl. older Windows exports).
p12-keystore = "0.4"
# Optional DeskLab account (account.rs): HTTPS with the same rustls + ring the
# updater uses, the OS keychain for the sign-in, and the computer's name.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = "4"
gethostname = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
